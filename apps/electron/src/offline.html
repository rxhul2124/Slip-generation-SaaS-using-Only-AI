<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Slipora Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Segoe UI, sans-serif;
        background: #f7faf9;
        color: #0d1f1b;
      }
      main {
        width: min(520px, calc(100vw - 40px));
        border: 1px solid #d6e4e0;
        border-radius: 8px;
        background: white;
        padding: 28px;
        box-shadow: 0 24px 90px rgba(9, 23, 20, 0.14);
      }
      h1 {
        margin: 0 0 10px;
      }
      p {
        color: #53645f;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Slipora Desktop is offline</h1>
      <p>Start the web app or configure a reachable Slipora URL. Offline queue and printer detection are still available through the desktop shell.</p>
    </main>
  </body>
</html>
